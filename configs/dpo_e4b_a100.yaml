# Stage 2 Direct Preference Optimization (DPO) Configuration for Gemma-4-E4B-Arabic on A100 80 GB
# Aligns Gemma-4-E4B-Arabic on Saudi dialect, MSA, and English UltraFeedback preference pairs against the frozen Stage 1 SFT reference adapter.

model:
  base_model_id: "unsloth/gemma-4-E4B-it"
  reference_model_id: "google/gemma-4-E4B-it"
  hf_hub_repo_id: "noman-asif/Gemma-4-E4B-Arabic-It"
  sft_adapter_dir: "outputs/sft_e4b_a100"
  max_seq_length: 3072
  dtype: "bfloat16"
  load_in_4bit: true

vram_optimization:
  target_vram_budget_gb: 80.0
  offload_ple_to_cpu: false
  ple_module_pattern: "embed_tokens_per_layer"
  ple_non_blocking_transfer: false
  offload_multimodal_towers_to_cpu: false
  multimodal_tower_patterns:
    - "audio_tower"
    - "vision_tower"
    - "embed_audio"
    - "embed_vision"
  restore_towers_before_export: false
  free_ref_model_vram: true
  ref_model: null
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 2

lora:
  use_rslora: false
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

dpo:
  beta: 0.2
  tr_alpha: 0.6
  tr_update_steps: 0
  loss_type: "sigmoid"
  max_length: 3072
  max_prompt_length: 1536
  max_completion_length: 1536
  label_smoothing: 0.0

training:
  output_dir: "outputs/dpo_e4b_a100"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  optim: "adamw_bnb_8bit"
  learning_rate: 2.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 1.0
  bf16: true
  tf32: true
  fp16: false
  dataloader_pin_memory: true
  dataloader_num_workers: 4
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  eval_strategy: "no"
  eval_steps: 200
  seed: 3407

datasets:
  total_target_pairs: 6000
  output_dataset_dir: "data/dpo_mixed"
  hf_hub_dataset_repo: "noman-asif/Arabic-Preference-DPO-6k"

  preference_sources:
    arabic_dialect_dpo_saudi:
      weight: 0.0
    arabic_orpo_dpo_mix_40k:
      weight: 0.4333
    arabic_reasoning_thinking_dpo:
      weight: 0.2667
    ultrafeedback_english_dpo:
      weight: 0.1333
    distilabel_math_thinking_dpo:
      weight: 0.1667
