# Standardized Before-and-After Benchmark Evaluation Configuration for the Gemma 4 Arabic Family
# Covers 6 OALL v2 Arabic benchmarks (LightEval), 4 official Gemma 4 retention benchmarks
# (MMLU-Pro, GPQA-Diamond, AIME-2026, LiveCodeBench-v6), and Iso-Active Latency/Throughput/VRAM profiling.

evaluation:
  base_model_id: "unsloth/gemma-4-E4B-it"
  sft_checkpoint_dir: "outputs/sft_e4b_a100"
  dpo_checkpoint_dir: "outputs/dpo_e4b_a100"
  merged_checkpoint_dir: "outputs/merged_gemma4_e4b_arabic/merged_16bit"
  output_report_path: "outputs/eval_reports/benchmark_comparison.md"
  output_json_path: "outputs/eval_reports/benchmark_results.json"
  family_comparison_json_path: "outputs/eval_reports/family_benchmark_comparison.json"
  batch_size: 32
  max_seq_length: 8192
  dtype: "bfloat16"
  device: "cuda:0"

models:
  e4b:
    label: "Gemma-4-E4B-Arabic-It"
    architecture: "Dense (4.5B Total / 4.0B Active)"
    base_model_id: "unsloth/gemma-4-E4B-it"
    unsloth_model_id: "unsloth/gemma-4-E4B-it"
    merged_checkpoint_dir: "outputs/merged_gemma4_e4b_arabic/merged_16bit"
    hf_repo_id: "noman-asif/Gemma-4-E4B-Arabic-It"
    device: "cuda:0"
    batch_size: 32

  26b_a4b:
    label: "Gemma-4-26B-A4B-Arabic-It"
    architecture: "Sparse MoE 128 Experts (25.2B Total / 3.8B Active)"
    base_model_id: "unsloth/gemma-4-26B-A4B-it"
    unsloth_model_id: "unsloth/gemma-4-26B-A4B-it"
    merged_checkpoint_dir: "outputs/merged_gemma4_26b_a4b_arabic/merged_16bit"
    hf_repo_id: "noman-asif/Gemma-4-26B-A4B-Arabic-It"
    device: "cuda:1"
    batch_size: 8

retention_gate:
  enforce_zero_forgetting: true
  min_retention_ratio: 0.95
  max_allowed_drop_pct: 5.00
  default_ties_lambda: 1.0
  ties_density: 1.0
  sweep_lambdas_on_regression:
    - 0.85
    - 0.90
    - 0.95
    - 1.00

arabic_benchmarks:
  ArabicMMLU:
    runner: "lighteval"
    lm_eval_task: "arabicmmlu"
    lighteval_task: "community|arabic_mmlu:All|0"
    helm_task: "arabic_mmlu"
    qimma_task: "MBZUAI/ArabicMMLU"
    metric: "acc_norm"
    num_fewshot: 0
    description: "Native 40-subject curriculum across KSA, Jordan, Egypt, and UAE (STEM, Islamic Studies, Arab Law, History, Civics)"

  MadinahQA:
    runner: "lighteval"
    lm_eval_task: "madinahqa"
    lighteval_task: "community|madinah_qa:_average|0"
    helm_task: "madinah_qa"
    qimma_task: "MBZUAI/MadinahQA"
    metric: "acc_norm"
    num_fewshot: 0
    description: "Classical and MSA Arabic language and grammar (Nahw, Sarf, Irab, Balagha)"

  AlGhafa:
    runner: "lighteval"
    lm_eval_task: "arabic_leaderboard_alghafa_light"
    lighteval_task: "community|alghafa:_average|0"
    helm_task: "alghafa"
    qimma_task: "OALL/AlGhafa-Arabic-LLM-Benchmark-Native"
    metric: "acc_norm"
    num_fewshot: 0
    description: "Native MSA and Saudi/Gulf/Egyptian dialect reading comprehension, grounded QA, and sentiment"

  ACVA:
    runner: "lighteval"
    lm_eval_task: "arabic_leaderboard_acva_light"
    lighteval_task: "community|acva:_average|5"
    helm_task: "acva"
    qimma_task: "OALL/ACVA"
    metric: "acc_norm"
    num_fewshot: 5
    description: "Arabic and Islamic cultural values alignment across 58 native subtasks"

  EXAMS-AR:
    runner: "lighteval"
    lm_eval_task: "arabic_exams"
    lighteval_task: "community|arabic_exams|0"
    helm_task: "arabic_exams"
    qimma_task: "OALL/Arabic_EXAMS"
    metric: "acc_norm"
    num_fewshot: 0
    description: "High-school subject examinations in Arabic across science and humanities"

  AraTrust:
    runner: "lighteval"
    lm_eval_task: "aratrust"
    lighteval_task: "community|aratrust:_average|0"
    helm_task: "aratrust"
    qimma_task: "asas-ai/AraTrust"
    metric: "acc_norm"
    num_fewshot: 0
    description: "Arabic safety, truthfulness, and trustworthiness evaluation"

  MMLU-ProX-Ar:
    runner: "lm_eval"
    lm_eval_task: "mmlu_prox_lite_ar"
    lighteval_task: "lm_eval|mmlu_prox_lite_ar|5"
    metric: "exact_match,custom-extract"
    num_fewshot: 5
    enable_thinking: true
    description: "Official MMLU-ProX-Lite Arabic 10-choice multi-step Thinking CoT across 14 disciplines (li-lab/MMLU-ProX-Lite)"

  MMMLU-Ar-STEM:
    runner: "inspect_evals"
    inspect_task: "inspect_evals/mmlu_0_shot"
    lm_eval_task: "inspect_evals/mmlu_0_shot:AR_XY_STEM"
    lighteval_task: "inspect_evals|mmlu_0_shot:AR_XY_STEM|0"
    mmmlu_language: "AR_XY"
    mmmlu_subjects:
      - "abstract_algebra"
      - "college_computer_science"
      - "college_mathematics"
      - "college_physics"
      - "econometrics"
      - "formal_logic"
    metric: "accuracy"
    num_fewshot: 0
    epochs: 1
    enable_thinking: true
    description: "Official OpenAI MMMLU Arabic (AR_XY) 0-shot Thinking CoT across Algebra, CS, Math, Physics, Econometrics, and Formal Logic"

  MMMLU-Ar-Law-Prof:
    runner: "inspect_evals"
    inspect_task: "inspect_evals/mmlu_0_shot"
    lm_eval_task: "inspect_evals/mmlu_0_shot:AR_XY_LAW_PROF"
    lighteval_task: "inspect_evals|mmlu_0_shot:AR_XY_LAW_PROF|0"
    mmmlu_language: "AR_XY"
    mmmlu_subjects:
      - "international_law"
      - "jurisprudence"
      - "professional_accounting"
      - "professional_medicine"
    metric: "accuracy"
    num_fewshot: 0
    epochs: 1
    enable_thinking: true
    description: "Official OpenAI MMMLU Arabic (AR_XY) 0-shot Thinking CoT across Jurisprudence, International Law, Medicine, and Accounting"

retention_anchors:
  MMLU-Pro:
    runner: "lm_eval"
    domain: "english_reasoning"
    lm_eval_task: "mmlu_pro"
    metric: "exact_match,custom-extract"
    num_fewshot: 5
    enable_thinking: true
    max_regression_pct: 5.00
    min_acceptable_score: 65.0

  GPQA-Diamond:
    runner: "inspect_evals"
    domain: "graduate_science_reasoning"
    inspect_task: "inspect_evals/gpqa_diamond"
    lm_eval_task: "inspect_evals/gpqa_diamond"
    metric: "accuracy"
    num_fewshot: 0
    epochs: 1
    enable_thinking: true
    max_regression_pct: 5.00
    min_acceptable_score: 48.0

  AIME-2026:
    runner: "inspect_evals"
    domain: "competition_math"
    inspect_task: "inspect_evals/aime2026"
    lm_eval_task: "inspect_evals/aime2026"
    metric: "accuracy"
    num_fewshot: 0
    epochs: 4
    enable_thinking: true
    max_regression_pct: 5.00
    min_acceptable_score: 48.0

  LiveCodeBench-v6:
    runner: "lighteval_lcb"
    domain: "code_generation"
    lighteval_task: "lcb:codegeneration_v6|0"
    lm_eval_task: "lcb:codegeneration_v6|0"
    metric: "pass@1"
    num_fewshot: 0
    num_samples: 1
    enable_thinking: true
    max_regression_pct: 5.00
    min_acceptable_score: 45.0

latency_benchmark:
  context_lengths:
    - 512
    - 2048
    - 4096
  max_new_tokens: 128
  warmup_runs: 2
  timed_runs: 5
  output_json_path: "outputs/eval_reports/latency_vram_report.json"

vllm_concurrency_benchmark:
  hardware_target: "Single NVIDIA A100-SXM4-80GB (80.0 GB HBM2e, vLLM PagedAttention + Continuous Batching)"
  gpu_vram_limit_gb: 80.0
  gpu_memory_utilization: 0.90
  dtype: "bfloat16"
  prompt_tokens: 512
  max_new_tokens: 256
  concurrency_users:
    - 1
    - 10
    - 30
    - 40
    - 50
  output_json_path: "outputs/eval_reports/vllm_concurrency_profile.json"
  output_markdown_path: "outputs/eval_reports/vllm_concurrency_report.md"

plotting:
  output_dir: "assets/plots"
  dpi: 300
  formats:
    - "png"
    - "svg"
