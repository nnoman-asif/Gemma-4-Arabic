# Stage 1 Supervised Fine-Tuning (SFT) Configuration for Gemma-4-E4B-Arabic (8.0 GB Single-GPU Tier)
# Optimized for a single 8.0 GB VRAM GPU with CPU PLE hook and multimodal tower offload.

model:
  base_model_id: "unsloth/gemma-4-E4B-it"
  reference_model_id: "google/gemma-4-E4B-it"
  total_parameters: "8.0B"
  effective_parameters: "4.5B"
  num_layers: 42
  vocab_size: 262144
  arabic_vocab_tokens: 8460
  max_seq_length: 4096
  dtype: "bfloat16"
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true

vram_optimization:
  target_vram_budget_gb: 8.0
  offload_ple_to_cpu: true
  ple_module_pattern: "embed_tokens_per_layer"
  ple_shape: [262144, 10752]
  ple_per_layer_dim: 256
  ple_non_blocking_transfer: true
  offload_multimodal_towers_to_cpu: true
  multimodal_tower_patterns:
    - "audio_tower"
    - "vision_tower"
    - "embed_audio"
    - "embed_vision"
  restore_towers_before_export: true
  freeze_embeddings_and_lm_head: true

lora:
  use_rslora: false
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  exclude_modules:
    - "vision_tower"
    - "multi_modal_projector"
    - "audio_tower"
    - "embed_tokens_per_layer"

training:
  output_dir: "outputs/sft_stage1"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  optim: "paged_adamw_8bit"
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  neftune_noise_alpha: null
  num_train_epochs: 1.0
  packing: false
  completion_only_loss: true
  bf16: true
  tf32: true
  fp16: false
  dataloader_pin_memory: true
  dataloader_num_workers: 0
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  eval_strategy: "no"
  eval_steps: 250
  seed: 3407

chat_template:
  add_generation_prompt: false
  preserve_thinking_tokens: true
  default_enable_thinking: false
  empty_thinking_block: "<|channel>thought\n<channel|>"

datasets:
  total_target_samples: 120000
  arabic_mix_ratio: 0.75
  replay_mix_ratio: 0.25
  output_dataset_dir: "data/sft_mixed"
  hf_hub_dataset_repo: "noman-asif/Arabic-Reasoning-Instruct-120k"

  arabic_sources:
    smolkalam_arabic_science:
      repo_id: "AdaMLLab/smolkalam-arabic-conversational-sft"
      config_name: "Mixture_of_Thoughts_science_no_think"
      split: "train"
      target_samples: 15000
      enable_thinking: false

    smolkalam_arabic_reasoning_cot:
      repo_id: "AdaMLLab/smolkalam-arabic-conversational-sft"
      config_name: "OpenThoughts3_50K"
      split: "train"
      target_samples: 12000
      enable_thinking: true

    smolkalam_arabic_openhermes:
      repo_id: "AdaMLLab/smolkalam-arabic-conversational-sft"
      config_name: "OpenHermes_2.5_no_think"
      split: "train"
      target_samples: 15000
      enable_thinking: false

    arabic_math_reasoning_synth:
      repo_id: "oddadmix/arabic-math-reasoning-synth"
      config_name: "default"
      split: "train"
      target_samples: 12000
      enable_thinking: true

    alpaca_gpt4_arabic:
      repo_id: "FreedomIntelligence/alpaca-gpt4-arabic"
      config_name: "default"
      split: "train"
      target_samples: 12000
      enable_thinking: false

    medical_reasoning_arabic:
      repo_id: "Gheras/Medical_Reasoning_Arabic_Dataset"
      config_name: "default"
      split: "train"
      target_samples: 6000
      enable_thinking: true

    aya_dataset_arabic:
      repo_id: "CohereLabs/aya_dataset"
      config_name: "default"
      split: "train"
      target_samples: 6000
      enable_thinking: false

    voho_saudi_dialogues:
      repo_id: "VohoAI/voho-saudi-dialogues"
      config_name: "default"
      split: "train"
      target_samples: 6000
      enable_thinking: false
      strip_speaker_prefixes: true
      json_column: "messages_json"

    saudi_arabic_laws:
      repo_id: "SaudiArabicLaws/saudi-arabic-laws-and-regulations-corpus"
      config_names:
        - "moj"
        - "boe"
      split: "train"
      target_samples: 6000
      enable_thinking: false

  replay_sources:
    opencode_reasoning_cot:
      repo_id: "nvidia/OpenCodeReasoning"
      config_name: "split_0"
      split: "split_0"
      target_samples: 7500
      enable_thinking: true

    codeforces_python_cot:
      repo_id: "open-r1/codeforces-cots"
      config_name: "solutions_py_decontaminated"
      split: "train"
      target_samples: 2500
      enable_thinking: true

    codefeedback_instruction:
      repo_id: "m-a-p/CodeFeedback-Filtered-Instruction"
      config_name: "default"
      split: "train"
      target_samples: 2000
      enable_thinking: false

    openmath_instruct2_cot:
      repo_id: "nvidia/OpenMathInstruct-2"
      config_name: "default"
      split: "train_1M"
      target_samples: 7500
      enable_thinking: true

    openscience_reasoning2_cot:
      repo_id: "nvidia/OpenScienceReasoning-2"
      config_name: "default"
      split: "train"
      target_samples: 6000
      enable_thinking: true

    ultrachat_english_replay:
      repo_id: "HuggingFaceH4/ultrachat_200k"
