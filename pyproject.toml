[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-4-arabic"
version = "0.2.0"
description = "Gemma 4 Arabic and Saudi dialect fine-tuning (QLoRA SFT, Conversational DPO, Lossless 16-Bit Merging) and evaluation pipeline for E4B and 26B-A4B."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Noman Asif" }
]
keywords = [
    "gemma-4",
    "arabic-llm",
    "saudi-dialect",
    "unsloth",
    "qlora",
    "dpo",
    "moe",
    "continual-learning"
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=5.5.0,<=5.17.0",
    "datasets>=4.8.5,<5.0.0",
    "accelerate>=1.6.0",
    "peft>=0.21.3",
    "trl>=1.15.0",
    "bitsandbytes>=0.49.0",
    "unsloth>=2026.4.1",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26.0",
    "hf-transfer>=0.1.8",
    "hf-xet>=1.1.8",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4.13",
    "inspect-ai>=0.3.290",
    "inspect-evals>=0.29.0",
]
serving = [
    "vllm>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
build-sft-dataset = "scripts.build_sft_dataset:main"
build-dpo-dataset = "scripts.build_dpo_dataset:main"
train-sft = "src.train_sft:main"
train-dpo = "src.train_dpo:main"
merge-and-export = "src.merge_and_export:main"
run-benchmarks = "scripts.run_benchmarks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -q"
